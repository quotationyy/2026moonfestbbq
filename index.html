/* ============================================================
   Design tokens — the shadcn/ui HSL variable system, but the
   values now come from the poster's palette instead of zinc, so
   the form reads as the same artwork rather than a light form
   bolted on underneath it. Committed to dark: the poster has no
   light rendition, and a light form below a dark poster looks
   like two pages stapled together.
   ============================================================ */
:root {
  color-scheme: dark;

  --background:          228 24% 4%;    /* #08090d — the poster's bed   */
  --foreground:          41 29% 93%;    /* #F3F0E9 — poster --text1     */
  --card:                24 8% 11%;
  --card-foreground:     41 29% 93%;
  --muted:               26 8% 15%;
  --muted-foreground:    37 9% 61%;     /* #A49D92 — poster --text3     */
  --border:              30 9% 19%;
  --input:               32 11% 27%;
  --primary:             34 54% 54%;    /* #C9924A — poster --accent    */
  --primary-foreground:  38 55% 8%;     /* #1B1409 — poster --on-accent */
  --ring:                34 54% 54%;
  --destructive:         6 72% 62%;
  --success:             142 55% 50%;
  --radius:              0.85rem;

  /* The poster's hairline, reused on every card so the whole page
     shares one edge treatment. */
  --hairline:            40 55% 92% / 0.08;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 0;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  /* "Inter" is deliberately absent: the copy embedded above is a
     subset cut for the poster, and letting the form reach for it
     would fall back glyph-by-glyph into a ransom note. */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 0.9375rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   Poster — palette-C-amber, design untouched. Every rule is
   scoped under .poster because the poster and the form both use
   .card, .rule and .moon for entirely different things.
   ============================================================ */
.poster-frame {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  /* Reserves the correct height before fit() runs, so the form
     below never jumps, and clips the poster if the two ever
     disagree by a pixel. */
  aspect-ratio: 1080 / 1350;
  overflow: hidden;
}
.poster {
  --bg1:#090A0F; --bg2:#0D0D11; --bg3:#151310; --bg4:#201913;
  --glow-lo:rgba(205,145,70,.18); --glow-moon:rgba(240,232,210,.09);
  --moon1:#FAF4E4; --moon2:#EEE4CB; --moon3:#DFD3B4;
  --moon-glow1:rgba(244,234,206,.30); --moon-glow2:rgba(210,195,155,.13);
  --accent:#C9924A; --on-accent:#1B1409;
  --chip-bg:#C9924A; --chip-ink:#1E1608;
  --eyebrow:#C6AE85; --eng-sub:#F2ECDF;
  --title-hi:#F6E3BE; --title-lo:#C6823B;
  --tg1:rgba(215,160,85,.30); --tg2:rgba(198,132,60,.22); --tg3:rgba(185,120,50,.11); --tg4:rgba(200,140,70,.07);
  --text1:#F3F0E9; --text2:#BAB4A8; --text3:#A49D92;
  --card-bg:rgba(36,34,33,.58); --card-line:rgba(255,245,225,.07);
  --panel:#EEE6D3; --panel-ink:#211B13; --panel-sub:#5A5142; --panel-lab:#AC7A2E; --panel-line:rgba(130,110,70,.22);
  --star:#F0EDE3; --tick:rgba(255,245,225,.10);
  --latin:"Inter";
  position:relative;width:1080px;height:1350px;overflow:hidden;
  /* The poster was laid out against the browser default line-height.
     Inheriting the form's 1.6 grows every element that does not set
     its own and pushes the footer past the fixed 1350px, where
     overflow:hidden silently eats it. */
  line-height:normal;
  font-family:var(--latin),"GSK","GenSekiGothic2 TW","Noto Sans TC",sans-serif;
  background:
    radial-gradient(1000px 560px at 50% 122%, var(--glow-lo), transparent 62%),
    radial-gradient(760px 460px at 86% 12%, var(--glow-moon), transparent 62%),
    linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 42%,var(--bg3) 78%,var(--bg4) 100%);
  display:flex;flex-direction:column;padding:84px 78px 42px;
}
/* The poster was authored against a global `* { margin:0; padding:0 }`
   reset. Scoped here so the form keeps its own spacing. */
.poster * { margin:0; padding:0 }
.poster > *{flex:0 0 auto}
.poster .star{position:absolute;display:block;background:var(--star);border-radius:50%;z-index:0}
.poster .moon{position:absolute;top:102px;right:108px;width:216px;height:216px;border-radius:50%;z-index:0;
  background:radial-gradient(circle at 36% 30%,var(--moon1) 0%,var(--moon2) 58%,var(--moon3) 100%);
  box-shadow:0 0 55px 16px var(--moon-glow1),0 0 150px 70px var(--moon-glow2)}
.poster .crater{position:absolute;border-radius:50%;background:rgba(160,132,84,.22)}
.poster .c1{width:52px;height:52px;left:56%;top:44%}
.poster .c2{width:26px;height:26px;left:24%;top:22%}
.poster .c3{width:18px;height:18px;left:74%;top:14%;background:rgba(160,132,84,.16)}
.poster .c4{width:14px;height:14px;left:38%;top:68%;background:rgba(160,132,84,.16)}

.poster .z{position:relative;z-index:1}
.poster .badge{align-self:flex-start;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:28px;letter-spacing:3px;padding:10px 32px;border-radius:999px}
.poster .eng-top{margin-top:20px;color:var(--eyebrow);font-weight:800;font-size:26px;letter-spacing:1px;font-variation-settings:"opsz" 32}
.poster .title{position:relative;margin-top:8px;font-weight:900;font-size:162px;letter-spacing:0;line-height:1.04;white-space:nowrap;
  transform:none;
  background:linear-gradient(180deg,var(--title-hi) 10%,var(--title-lo) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:
    drop-shadow(0 0 10px var(--tg1))
    drop-shadow(0 0 26px var(--tg2))
    drop-shadow(0 0 62px var(--tg3))}
.poster .title::before{content:"";position:absolute;left:-3%;right:2%;top:-6%;bottom:-6%;z-index:-1;pointer-events:none;
  background:radial-gradient(48% 52% at 44% 52%, var(--tg4), transparent 76%);
  filter:blur(26px)}
.poster .eng-sub{margin-top:8px;color:var(--eng-sub);font-weight:800;font-size:42px;letter-spacing:4px;font-variation-settings:"opsz" 32}
.poster .rule{margin-top:20px;width:231px;height:8px;background:var(--accent);border-radius:6px}
.poster .slogan{margin-top:22px;color:var(--text2);font-size:30px;letter-spacing:2px}

.poster .card{margin-top:30px;border-radius:30px;background:var(--card-bg);border:1px solid var(--card-line);padding:28px 44px}
.poster .row{display:flex;align-items:flex-start;gap:26px}
.poster .row+.row{margin-top:12px}
.poster .chip{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;color:var(--chip-ink);font-weight:900;font-size:30px}
.poster .row h3{font-size:34px;font-weight:900;color:var(--text1);line-height:1.2;letter-spacing:1px}
.poster .row p{margin-top:5px;font-size:24px;color:var(--text3);letter-spacing:1px;line-height:1.25}

.poster .info{margin-top:24px;background:var(--panel);border-radius:26px;display:flex;padding:26px 6px}
.poster .col{flex:1;text-align:center;padding:0 4px}
.poster .col+.col{border-left:2px solid var(--panel-line)}
.poster .lab{color:var(--panel-lab);font-weight:900;font-size:26px;letter-spacing:5px}
.poster .big{color:var(--panel-ink);font-weight:600;font-variation-settings:"opsz" 32;font-size:55px;margin-top:8px;line-height:1.05;white-space:nowrap}
.poster .sm{color:var(--panel-sub);font-size:23px;margin-top:9px;white-space:nowrap}

.poster .foot{margin-top:44px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.poster .foot h4{font-size:39px;font-weight:900;color:var(--text1);letter-spacing:2px}
.poster .foot p{margin-top:9px;font-size:26px;color:var(--text3);letter-spacing:2px}
.poster .host{background:var(--accent);color:var(--on-accent);width:37px;height:37px;border-radius:50%;padding:0;align-self:center;display:flex;align-items:center;justify-content:center}
.poster .host svg{display:block;width:12.3px;height:auto}

.poster .ticks{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;z-index:0}
.poster .ticks i{width:2px;background:var(--tick)}

/* ============================================================
   The page below the poster
   ============================================================ */
main {
  /* Carry the poster's warm bottom edge (--bg4) down into the page
     instead of cutting to black at its last pixel. */
  background: linear-gradient(180deg,
    hsl(27 25% 10%) 0,
    hsl(var(--background)) 34rem);
  padding: 0 0 6rem;
}
.wrap { max-width: 40rem; margin: 0 auto; padding: 0 1rem; }

/* ---------- Card ----------
   Scoped to main: the poster has its own .card, and a bare .card
   rule here reaches inside it. (Its margin-bottom was silently
   adding 14px to the poster's layout.) */
main .card {
  background: hsl(var(--card) / 0.72);
  color: hsl(var(--card-foreground));
  border: 1px solid hsl(var(--hairline));
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 0.875rem;
}

/* ---------- Event detail list ---------- */
.details { display: grid; gap: 0.625rem; }
.details div {
  display: grid;
  grid-template-columns: 5.5rem 1fr;
  gap: 0.5rem;
  align-items: baseline;
}
.details dt {
  font-size: 0.8125rem; font-weight: 600;
  color: hsl(var(--muted-foreground));
  letter-spacing: 0.01em;
}
.details dd { margin: 0; font-weight: 500; }
.details dd .accent { color: hsl(var(--primary)); font-weight: 700; }

.prose p { margin: 0 0 0.75rem; }
.prose p:last-child { margin-bottom: 0; }
.menu {
  display: grid; gap: 0.375rem;
  margin: 0.875rem 0 0; padding: 0.875rem 0 0;
  border-top: 1px solid hsl(var(--border));
  list-style: none;
}
.menu li { font-size: 0.875rem; }

/* ---------- Section heading ---------- */
.section { margin: 2rem 0 0.875rem; }
.section h2 {
  margin: 0;
  font-size: 1.0625rem; font-weight: 700;
  letter-spacing: -0.01em;
}
.section .rule {
  height: 1px; margin-top: 0.875rem;
  background: hsl(var(--border));
}

/* ---------- Form field (shadcn anatomy) ---------- */
.field { display: grid; gap: 0.5rem; }
.field.invalid { border-color: hsl(var(--destructive)); }
label.lbl {
  font-size: 0.875rem; font-weight: 600;
  line-height: 1.45; letter-spacing: -0.005em;
}
.req { color: hsl(var(--destructive)); margin-inline-start: 0.15rem; }
.desc {
  font-size: 0.8125rem;
  color: hsl(var(--muted-foreground));
  margin: -0.125rem 0 0;
  white-space: pre-line;
}

input[type=text], input[type=tel], input[type=email], textarea {
  width: 100%;
  font: inherit; font-size: 0.9375rem;
  color: hsl(var(--foreground));
  background: hsl(var(--background) / 0.6);
  border: 1px solid hsl(var(--input));
  border-radius: calc(var(--radius) - 0.3rem);
  padding: 0.5rem 0.75rem;
  min-height: 2.5rem;
  transition: border-color .12s, box-shadow .12s;
}
textarea { min-height: 5rem; resize: vertical; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: hsl(var(--muted-foreground) / 0.55); }
input:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: hsl(var(--ring));
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25);
}

}

/* ---------- Radio group ---------- */
.radios { display: grid; gap: 0.125rem; }
.radio {
  display: flex; align-items: center; gap: 0.625rem;
  padding: 0.625rem 0.75rem; margin: 0 -0.75rem;

}
.radio:hover { background: hsl(var(--muted) / 0.7); }
.radio span { font-size: 0.9375rem; }
input[type=radio] {
  appearance: none; -webkit-appearance: none;
  flex: none; margin: 0;
  width: 1rem; height: 1rem;
  border: 1px solid hsl(var(--primary));
  border-radius: 50%;
  display: grid; place-content: center;
  cursor: pointer;
  transition: box-shadow .12s;
}
input[type=radio]::after {
  content: ""; width: 0.5rem; height: 0.5rem;
  border-radius: 50%;
  background: hsl(var(--primary));
  transform: scale(0);
  transition: transform .12s ease-out;
}
input[type=radio]:checked::after { transform: scale(1); }
input[type=radio]:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.3); }
.field.invalid input[type=radio] { border-color: hsl(var(--destructive)); }

/* ---------- Error text ---------- */
.err {
  font-size: 0.8125rem; font-weight: 500;
  color: hsl(var(--destructive));
  display: none;
}
.field.invalid .err { display: block; }

/* ---------- Notice / policy ---------- */
.notice {
  border-left: 2px solid hsl(var(--primary));
  background: hsl(var(--muted) / 0.6);
  border-radius: calc(var(--radius) - 0.35rem);
  padding: 0.875rem 1rem;

}
.notice strong { font-weight: 700; }
.todo {

}
.policy { display: grid; gap: 0.75rem; font-size: 0.8125rem;
          color: hsl(var(--muted-foreground)); }
.policy strong { color: hsl(var(--foreground)); }

/* ---------- Button ---------- */
.actions { margin-top: 1.5rem; display: grid; gap: 0.75rem; }
button {
  font: inherit; font-size: 0.9375rem; font-weight: 700;
  height: 2.75rem; padding: 0 1.25rem;

button:disabled { opacity: 0.5; cursor: default; }
.legend { font-size: 0.8125rem; color: hsl(var(--muted-foreground)); }

.hp { position: absolute; left: -9999px; width: 1px; height: 1px; }
[hidden] { display: none !important; }

/* ---------- Done state ---------- */
.done { text-align: center; padding: 3.5rem 1.25rem; }

<script>
/* The poster's own starfield, tick strip and fit-to-width scaling.
   Runs here, right after the markup, so the artwork is sized before
   the form below it paints. */
(function () {
  const poster = document.getElementById("poster");
  const frame  = poster.parentNode;
  const rand   = (a, b) => a + Math.random() * (b - a);

  /* Stars sit in the top 720px only — that is where the gradient is
     still night sky, before it warms into ember at the bottom. */
  for (let i = 0; i < 130; i++) {
    const s = document.createElement("i");
    const size = rand(1.4, 3.4);
    s.className = "star";
    s.style.width = s.style.height = size + "px";
    s.style.left = rand(0, 1080) + "px";
    s.style.top = rand(0, 720) + "px";
    s.style.opacity = rand(.25, .95);
    poster.appendChild(s);
  }

  const ticks = document.getElementById("ticks");
  for (let j = 0; j < 56; j++) {
    const b = document.createElement("i");
    b.style.height = (j % 4 === 0 ? 20 : 12) + "px";
    ticks.appendChild(b);
  }

  /* The poster is drawn at a fixed 1080x1350 and scaled to whatever
     width it gets. zoom (not transform) so the frame's layout height
     follows the scale on its own. */
  const fit = () => { poster.style.zoom = Math.min(frame.clientWidth / 1080, 1); };
  fit();
  addEventListener("resize", fit);
})();
</script>

  { kind: "notice", todo: true, text:

/* 介面文字。要改語言只改這裡。 */
const MSG = {
  submit:    "提交",
  sending:   "送出中…",
  legend:    "* 表示必填問題",
  doneTitle: "報名完成",
  required:  "必填｜Required",

  digits:    n => `請填 ${n} 位數字｜Must be ${n} digits`,

};

/* ============================================================
   以下不需要修改。
   ============================================================ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const questions = () => ITEMS.filter(i => i.id);

function render() {
  app.innerHTML = `
    <div class="section"><h2>${esc(MSG.info)}</h2><div class="rule"></div></div>

    <div class="card">
      <dl class="details">

  const form = document.getElementById("form");

  form.addEventListener("input", onInput);

function renderItem(item) {
  const hide = item.showIf ? " hidden" : "";

  if (item.kind === "section") {
    return `<div class="section"${hide} data-item="${esc(item.title)}">
      <h2>${esc(item.title)}</h2><div class="rule"></div></div>`;
  }

  if (item.kind === "notice") {
    return `<div class="notice${item.todo ? " todo" : ""}"${hide}
      data-cond="${item.showIf ? esc(item.showIf.id) : ""}">
      <div>${esc(item.text)}</div></div>`;
  }

  const req = item.required ? '<span class="req" aria-hidden="true">*</span>' : "";
  const desc = item.desc ? `<p class="desc" id="d-${esc(item.id)}">${esc(item.desc)}</p>` : "";
  const describedBy = item.desc ? ` aria-describedby="d-${esc(item.id)}"` : "";
  let control = "";

  if (item.type === "radio") {
    control = `<div class="radios" role="radiogroup"${describedBy}>
      ${item.options.map(o => `<label class="radio">
        <input type="radio" name="${esc(item.id)}" value="${esc(o)}">
        <span>${esc(o)}</span></label>`).join("")}
    </div>`;
  } else if (item.type === "textarea") {
    control = `<textarea name="${esc(item.id)}" rows="3"${describedBy}
      placeholder="${esc(item.placeholder || "")}"></textarea>`;
  } else {
    const ml = item.maxlength ? ` maxlength="${item.maxlength}"` : "";
    const mode = item.type === "tel" ? ' inputmode="tel"'
               : item.id === "transfer_last5" ? ' inputmode="numeric"' : "";
    control = `<input type="${esc(item.type)}" name="${esc(item.id)}"${ml}${mode}${describedBy}
      placeholder="${esc(item.placeholder || "")}" autocomplete="${
        item.id === "name" ? "name" : item.id === "email" ? "email"
        : item.id === "phone" ? "tel" : "off"}">`;
  }

  return `<div class="card field" data-id="${esc(item.id)}"${hide}>
    <label class="lbl">${esc(item.label)}${req}</label>
    ${desc}${control}
    <div class="err"></div>
  </div>`;
}

/* Show or hide the +1 and licence-plate fields to match what has
   been chosen. Hidden fields are never validated and submit blank. */
function applyConditions() {
  const form = document.getElementById("form");
  for (const item of ITEMS) {
    if (!item.showIf) continue;
    const { id, equals, notEquals } = item.showIf;
    const picked = [...form.querySelectorAll(`[name="${CSS.escape(id)}"]`)]
      .find(n => n.checked);
    const value = picked ? picked.value : "";
    const on = equals != null ? value === equals
             : notEquals != null ? value !== "" && value !== notEquals
             : true;
    const el = item.id
      ? form.querySelector(`.field[data-id="${CSS.escape(item.id)}"]`)
      : form.querySelector(`.notice[data-cond="${CSS.escape(id)}"]`);
    if (!el) continue;
    el.hidden = !on;
    if (!on) clearError(el);
  }
}

function isHidden(item) {
  if (!item.showIf) return false;
  const el = document.querySelector(`.field[data-id="${CSS.escape(item.id)}"]`);
  return !el || el.hidden;
}

function collect() {
  const form = document.getElementById("form");
  const answers = {}, errors = [];

  for (const q of questions()) {
    const nodes = form.querySelectorAll(`[name="${CSS.escape(q.id)}"]`);
    const hidden = isHidden(q);
    let value;

    if (q.type === "radio") {
      const hit = [...nodes].find(n => n.checked);
      value = hit ? hit.value : "";
    } else {
      value = nodes[0].value.trim();
    }
    if (hidden) value = "";

    if (!hidden) {
      if (q.required && !value) {
        errors.push([q.id, MSG.required]);
      } else if (value && q.type === "email" &&
                 !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) {
        errors.push([q.id, MSG.email]);
      } else if (value && q.type === "tel" &&
                 !/^[\d+\-() ]{8,}$/.test(value)) {
        errors.push([q.id, MSG.phone]);
      } else if (value && q.maxlength && !new RegExp(`^\\d{${q.maxlength}}$`).test(value)) {
        errors.push([q.id, MSG.digits(q.maxlength)]);
      }
    }
    answers[q.id] = value;
  }
  return { answers, errors, hp: form.elements._hp.value };
}

function clearError(el) {
  el.classList.remove("invalid");
  const e = el.querySelector(".err");
  if (e) e.textContent = "";
}

function onInput(ev) {
  applyConditions();
  const field = ev.target.closest(".field");
  if (field && field.classList.contains("invalid")) clearError(field);
}

function showErrors(errors) {
  document.querySelectorAll(".field").forEach(clearError);
  for (const [id, msg] of errors) {
    const el = document.querySelector(`.field[data-id="${CSS.escape(id)}"]`);
    if (el) { el.classList.add("invalid"); el.querySelector(".err").textContent = msg; }
  }
  const first = document.querySelector(".field.invalid");
  if (first) {
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    const focusable = first.querySelector("input, textarea");
    if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 320);
  }
}

async function onSubmit(ev) {
  ev.preventDefault();
  const btn = document.getElementById("submit");
  const status = document.getElementById("status");
  const { answers, errors, hp } = collect();

  showErrors(errors);
  if (errors.length) {
    status.className = "status bad";
    status.textContent = MSG.fixCount(errors.length);
    return;
  }
  if (SCRIPT_URL.startsWith("PASTE_")) {
    status.className = "status bad";
    status.textContent = MSG.unset;
    return;
  }

  btn.disabled = true;
  status.className = "status";
  status.textContent = MSG.sending;

  try {
    // text/plain keeps this a "simple" CORS request, so the browser
    // skips the preflight that Apps Script cannot answer.
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        answers, _hp: hp,
        meta: { submittedAt: new Date().toISOString(), page: location.href }
      })
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "server rejected the response");

    app.innerHTML = `<div class="card done">
      <div class="tick">✓</div>
      <h2>${esc(MSG.doneTitle)}</h2>
      <p>${esc(EVENT.thanks)}</p>
    </div>`;
    /* Scroll to the confirmation, not to the top — the poster is
       1350px tall and would bury the message off-screen. */
    document.querySelector("main").scrollIntoView({ behavior: "smooth", block: "start" });

  } catch (err) {
    btn.disabled = false;
    status.className = "status bad";
    status.textContent = MSG.failed(err.message);
  }
}

render();
</script>
</body>
</html>
