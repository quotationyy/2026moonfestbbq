<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中秋卡肉趴｜報名</title>
<style>
/* ============================================================
   Design tokens — shadcn/ui's HSL variable system, zinc base,
   with the primary swapped to a warm amber for the Mid-Autumn
   moon-and-fire theme. Every colour is defined on bare :root so
   the dark block only has to override, never introduce.
   ============================================================ */
:root {
  --background:          0 0% 100%;
  --foreground:          240 10% 3.9%;
  --card:                0 0% 100%;
  --card-foreground:     240 10% 3.9%;
  --muted:               240 4.8% 95.9%;
  --muted-foreground:    240 3.8% 46.1%;
  --border:              240 5.9% 90%;
  --input:               240 5.9% 90%;
  --primary:             22 92% 46%;
  --primary-foreground:  0 0% 100%;
  --ring:                22 92% 46%;
  --destructive:         0 72% 51%;
  --success:             142 71% 35%;
  --radius:              0.65rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background:         240 10% 3.9%;
    --foreground:         0 0% 98%;
    --card:               240 10% 6%;
    --card-foreground:    0 0% 98%;
    --muted:              240 3.7% 15.9%;
    --muted-foreground:   240 5% 64.9%;
    --border:             240 3.7% 17%;
    --input:              240 3.7% 22%;
    --primary:            25 95% 53%;
    --primary-foreground: 0 0% 100%;
    --ring:               25 95% 53%;
    --destructive:        0 63% 57%;
    --success:            142 65% 45%;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 0 1rem 6rem;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
               "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 0.9375rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
.wrap { max-width: 40rem; margin: 0 auto; }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  margin: 0 -1rem 1.25rem;
  padding: 3.25rem 1rem 1.75rem;
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(38rem 15rem at 50% -4rem,
      hsl(var(--primary) / 0.16), transparent 70%),
    radial-gradient(12rem 12rem at 78% 12%,
      hsl(48 96% 60% / 0.12), transparent 70%);
  pointer-events: none;
}
.moon {
  position: relative;
  font-size: 2.5rem; line-height: 1;
  display: block; margin-bottom: 0.75rem;
}
h1 {
  position: relative;
  margin: 0;
  font-size: clamp(1.6rem, 6.5vw, 2.15rem);
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.2;
}
.tagline {
  position: relative;
  margin: 0.5rem 0 0;
  font-size: 1rem;
  color: hsl(var(--muted-foreground));
  font-weight: 500;
}

/* ---------- Card ---------- */
.card {
  background: hsl(var(--card));
  color: hsl(var(--card-foreground));
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius);
  box-shadow: 0 1px 2px 0 hsl(240 10% 3.9% / 0.04);
  padding: 1.25rem;
  margin-bottom: 0.875rem;
}

/* ---------- Event detail list ---------- */
.details { display: grid; gap: 0.625rem; }
.details div {
  display: grid;
  grid-template-columns: 5.5rem 1fr;
  gap: 0.5rem;
  align-items: baseline;
}
.details dt {
  font-size: 0.8125rem; font-weight: 600;
  color: hsl(var(--muted-foreground));
  letter-spacing: 0.01em;
}
.details dd { margin: 0; font-weight: 500; }
.details dd .accent { color: hsl(var(--primary)); font-weight: 700; }

.prose p { margin: 0 0 0.75rem; }
.prose p:last-child { margin-bottom: 0; }
.menu {
  display: grid; gap: 0.375rem;
  margin: 0.875rem 0 0; padding: 0.875rem 0 0;
  border-top: 1px solid hsl(var(--border));
  list-style: none;
}
.menu li { font-size: 0.875rem; }

/* ---------- Section heading ---------- */
.section { margin: 2rem 0 0.875rem; }
.section h2 {
  margin: 0;
  font-size: 1.0625rem; font-weight: 700;
  letter-spacing: -0.01em;
}
.section .rule {
  height: 1px; margin-top: 0.875rem;
  background: hsl(var(--border));
}

/* ---------- Form field (shadcn anatomy) ---------- */
.field { display: grid; gap: 0.5rem; }
.field.invalid { border-color: hsl(var(--destructive)); }
label.lbl {
  font-size: 0.875rem; font-weight: 600;
  line-height: 1.45; letter-spacing: -0.005em;
}
.req { color: hsl(var(--destructive)); margin-inline-start: 0.15rem; }
.desc {
  font-size: 0.8125rem;
  color: hsl(var(--muted-foreground));
  margin: -0.125rem 0 0;
  white-space: pre-line;
}

input[type=text], input[type=tel], input[type=email], textarea {
  width: 100%;
  font: inherit; font-size: 0.9375rem;
  color: hsl(var(--foreground));
  background: hsl(var(--background));
  border: 1px solid hsl(var(--input));
  border-radius: calc(var(--radius) - 0.2rem);
  padding: 0.5rem 0.75rem;
  min-height: 2.5rem;
  transition: border-color .12s, box-shadow .12s;
}
textarea { min-height: 5rem; resize: vertical; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: hsl(var(--muted-foreground) / 0.7); }
input:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: hsl(var(--ring));
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.18);
}
.field.invalid input, .field.invalid textarea {
  border-color: hsl(var(--destructive));
}

/* ---------- Radio group ---------- */
.radios { display: grid; gap: 0.125rem; }
.radio {
  display: flex; align-items: center; gap: 0.625rem;
  padding: 0.625rem 0.75rem; margin: 0 -0.75rem;
  border-radius: calc(var(--radius) - 0.2rem);
  cursor: pointer;
  transition: background .12s;
}
.radio:hover { background: hsl(var(--muted)); }
.radio span { font-size: 0.9375rem; }
input[type=radio] {
  appearance: none; -webkit-appearance: none;
  flex: none; margin: 0;
  width: 1rem; height: 1rem;
  border: 1px solid hsl(var(--primary));
  border-radius: 50%;
  display: grid; place-content: center;
  cursor: pointer;
  transition: box-shadow .12s;
}
input[type=radio]::after {
  content: ""; width: 0.5rem; height: 0.5rem;
  border-radius: 50%;
  background: hsl(var(--primary));
  transform: scale(0);
  transition: transform .12s ease-out;
}
input[type=radio]:checked::after { transform: scale(1); }
input[type=radio]:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25); }
.field.invalid input[type=radio] { border-color: hsl(var(--destructive)); }

/* ---------- Error text ---------- */
.err {
  font-size: 0.8125rem; font-weight: 500;
  color: hsl(var(--destructive));
  display: none;
}
.field.invalid .err { display: block; }

/* ---------- Notice / policy ---------- */
.notice {
  border-left: 2px solid hsl(var(--primary));
  background: hsl(var(--muted) / 0.6);
  border-radius: calc(var(--radius) - 0.25rem);
  padding: 0.875rem 1rem;
  font-size: 0.875rem;
  display: grid; gap: 0.5rem;
}
.notice strong { font-weight: 700; }
.todo {
  border-left-color: hsl(var(--destructive));
  background: hsl(var(--destructive) / 0.07);
}
.policy { display: grid; gap: 0.75rem; font-size: 0.8125rem;
          color: hsl(var(--muted-foreground)); }
.policy strong { color: hsl(var(--foreground)); }

/* ---------- Button ---------- */
.actions { margin-top: 1.5rem; display: grid; gap: 0.75rem; }
button {
  font: inherit; font-size: 0.9375rem; font-weight: 600;
  height: 2.75rem; padding: 0 1.25rem;
  border: 0; border-radius: calc(var(--radius) - 0.2rem);
  background: hsl(var(--primary));
  color: hsl(var(--primary-foreground));
  cursor: pointer;
  transition: opacity .12s, box-shadow .12s;
}
button:hover:not(:disabled) { opacity: 0.9; }
button:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.4); }
button:disabled { opacity: 0.5; cursor: default; }
.legend { font-size: 0.8125rem; color: hsl(var(--muted-foreground)); }
.status { font-size: 0.875rem; color: hsl(var(--muted-foreground)); min-height: 1.25rem; }
.status.bad { color: hsl(var(--destructive)); font-weight: 500; }

.hp { position: absolute; left: -9999px; width: 1px; height: 1px; }
[hidden] { display: none !important; }

/* ---------- Done state ---------- */
.done { text-align: center; padding: 3.5rem 1.25rem; }
.done .tick {
  width: 3rem; height: 3rem; margin: 0 auto 1rem;
  border-radius: 50%;
  background: hsl(var(--success) / 0.12);
  color: hsl(var(--success));
  display: grid; place-content: center;
  font-size: 1.5rem;
}
.done h2 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 700; }
.done p { margin: 0; color: hsl(var(--muted-foreground)); white-space: pre-line; }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script>
/* ============================================================
   1. 貼上 Apps Script 網頁應用程式網址（見 README.md）
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzp-tErARlbGJ30wrcv4yZpr_0lbvy4uhRp2IzFeYQjfJq9HI2Tvf3tMaK1wBF8R2lk/exec";

/* ============================================================
   2. 活動資訊與題目。
      問題 wording 逐字沿用原本的 Google 表單；標題與活動資訊
      改用 Threads 文案的中秋版本。
   ============================================================ */
const EVENT = {
  moon: "🌕",
  title: "中秋卡肉趴",
  tagline: "別人賞月，我們賞肉",
  details: [
    ["地點",     "北投・奇岩站・豐禾公寓大廈"],
    ["日期",     "9/26（六）中秋連假"],
    ["時間",     "17:30–23:00"],
    ["費用",     "$1,500／人（餐點＋酒水）", true],
    ["人數",     "約 50 人"],
    ["報名截止", "8/31（一）", true]
  ],
  intro: [
    "中秋就是要烤肉吧 🔥 想揪大家一起來北投過中秋，朋友帶朋友、認識點新朋友，一起吃肉喝酒聊天。",
    "不用煩惱要帶什麼，人來就好。"
  ],
  menu: [
    "🥩 牛胸肉、牛小排、雞串、豬肉、海鮮",
    "🥬 蔬食、配菜也有",
    "🍻 啤酒、調酒、無酒精飲料",
    "🎶 音樂、烤肉、喝酒、聊天，吃飽了再一起玩"
  ],
  transport: [
    ["🚗", "現場可停車，但車位數量有限，會依實際收到款項的順序保留車位"],
    ["🚇", "捷運奇岩站步行可到"]
  ],
  policies: [
    ["取消政策",
     "若臨時不能來，麻煩於活動開始前 48 小時告知。48 小時內取消，因食材與相關費用已提前準備，將酌收 50% 費用，謝謝大家體諒 🙏"],
    ["雨天備案",
     "若遇下雨，會在活動當天於限時動態公告是否改期。"],
    ["互相尊重",
     "大家一起玩最重要的就是舒服自在，活動中請彼此尊重，不接受任何形式的性騷擾、歧視，以及讓他人感到不舒服的言語或肢體行為。"]
  ],
  thanks: "報名資料已送出，我們會核對款項後與你確認。\n有任何變動請直接私訊我 🙏"
};

const ITEMS = [
  { kind: "section", title: "About You｜關於你" },

  { id: "name",  type: "text",  label: "Your Name｜姓名",     required: true },
  { id: "phone", type: "tel",   label: "Phone Number｜電話",  required: true },
  { id: "email", type: "email", label: "Email｜電子郵件",     required: true },

  { id: "joining", type: "radio", required: true,
    label: "How will you be joining us?｜這次會怎麼參加呢？",
    options: ["Attending solo｜自己參加", "Bringing a +1｜攜伴一位"] },

  /* 這四題（同行者三欄＋車牌）跟原本的 Google 表單一樣「永遠顯示、
     全部選填」。若想改成選了才展開，加上例如
       showIf: { id: "joining", equals: "Bringing a +1｜攜伴一位" }
     applyConditions() 會自動處理，隱藏的題目不驗證、送出為空值。 */
  { kind: "notice", text:
    "If you're bringing a +1, please complete the details below.\n攜伴者請填寫以下資訊。" },

  { id: "guest_name",  type: "text",  label: "Guest Name｜同行者姓名" },
  { id: "guest_phone", type: "tel",   label: "Guest Phone Number｜同行者電話" },
  { id: "guest_email", type: "email", label: "Guest Email｜同行者 Email" },

  { kind: "section", title: "A Few More Details｜再告訴我們一些資訊" },

  { id: "dietary", type: "textarea",
    label: "Dietary Preferences & Allergies｜飲食需求與過敏資訊",
    desc: "Please let us know if you or your +1 have any food allergies, dietary restrictions, or ingredients you prefer not to eat.\n如果你或同行者有任何食物過敏、飲食限制或不吃的食材，請在這裡告訴我們。\n\ne.g. Vegetarian / No beef / Seafood allergy / None",
    placeholder: "e.g. Vegetarian / No beef / Seafood allergy / None" },

  /* ⚠️ 收款帳號原本的 Google 表單完全沒有提到，填的人無法匯款。
     把帳號填進下面 text 後，把 todo 改成 false。 */
  { kind: "notice", todo: true, text:
    "⚠️ 收款資訊待填 —— 請把銀行代號與帳號補在這裡，不然沒人知道要匯到哪。\n（例如：OO 銀行（代號 000）帳號 0000-0000-0000　戶名：OOO）" },

  { id: "transfer_last5", type: "text", required: true,
    label: "Last 5 Digits of Your Transfer Account｜轉帳帳號後五碼",
    desc: "Please enter the last 5 digits of the account used for your bank transfer so we can match your payment.\n請填寫轉帳帳號後五碼，以便我們核對款項。",
    placeholder: "12345", maxlength: 5 },

  { id: "parking", type: "radio", required: true,
    label: "Do you need parking?｜是否需要停車位？",
    desc: "Parking spaces are limited and will be reserved based on the order in which payments are received.\n停車位數量有限，將依實際收到款項的順序保留。",
    options: ["No parking needed｜不需要", "Car parking｜汽車", "Scooter parking｜機車"] },

  { id: "plate", type: "text",
    label: "License Plate Number｜車牌號碼",
    desc: "If you require parking, please enter your license plate number.\n如需停車位，請填寫完整車牌號碼。",
    placeholder: "ABC-1234" }
];

/* 介面文字。要改語言只改這裡。 */
const MSG = {
  submit:    "提交",
  sending:   "送出中…",
  legend:    "* 表示必填問題",
  doneTitle: "報名完成",
  required:  "必填｜Required",
  email:     "Email 格式不正確｜Invalid email",
  phone:     "電話格式不正確｜Invalid phone number",
  digits:    n => `請填 ${n} 位數字｜Must be ${n} digits`,
  fixCount:  n => `還有 ${n} 題要修正`,
  failed:    e => `送不出去：${e} 請再試一次。`,
  unset:     "還沒設定：請把 Apps Script 網址填進 index.html 的 SCRIPT_URL（見 README.md）。"
};

/* ============================================================
   以下不需要修改。
   ============================================================ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const questions = () => ITEMS.filter(i => i.id);

function render() {
  app.innerHTML = `
    <div class="hero">
      <span class="moon">${EVENT.moon}</span>
      <h1>${esc(EVENT.title)}</h1>
      <p class="tagline">${esc(EVENT.tagline)}</p>
    </div>

    <div class="card">
      <dl class="details">
        ${EVENT.details.map(([k, v, hot]) => `<div>
          <dt>${esc(k)}</dt>
          <dd${hot ? ' class="accent"' : ""}>${hot
            ? `<span class="accent">${esc(v)}</span>` : esc(v)}</dd>
        </div>`).join("")}
      </dl>
    </div>

    <div class="card prose">
      ${EVENT.intro.map(p => `<p>${esc(p)}</p>`).join("")}
      <ul class="menu">
        ${EVENT.menu.map(m => `<li>${esc(m)}</li>`).join("")}
        ${EVENT.transport.map(([i, t]) => `<li>${esc(i)} ${esc(t)}</li>`).join("")}
      </ul>
    </div>

    <form id="form" novalidate>
      ${ITEMS.map(renderItem).join("")}

      <div class="section"><h2>報名前請確認</h2><div class="rule"></div></div>
      <div class="card"><div class="policy">
        ${EVENT.policies.map(([h, t]) =>
          `<div><strong>${esc(h)}</strong><br>${esc(t)}</div>`).join("")}
      </div></div>

      <input class="hp" type="text" name="_hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="actions">
        <p class="legend">${esc(MSG.legend)}</p>
        <button type="submit" id="submit">${esc(MSG.submit)}</button>
        <div class="status" id="status" role="status"></div>
      </div>
    </form>`;

  const form = document.getElementById("form");
  form.addEventListener("submit", onSubmit);
  form.addEventListener("input", onInput);
  form.addEventListener("change", onInput);
  applyConditions();
}

function renderItem(item) {
  const hide = item.showIf ? " hidden" : "";

  if (item.kind === "section") {
    return `<div class="section"${hide} data-item="${esc(item.title)}">
      <h2>${esc(item.title)}</h2><div class="rule"></div></div>`;
  }

  if (item.kind === "notice") {
    return `<div class="notice${item.todo ? " todo" : ""}"${hide}
      data-cond="${item.showIf ? esc(item.showIf.id) : ""}">
      <div>${esc(item.text)}</div></div>`;
  }

  const req = item.required ? '<span class="req" aria-hidden="true">*</span>' : "";
  const desc = item.desc ? `<p class="desc" id="d-${esc(item.id)}">${esc(item.desc)}</p>` : "";
  const describedBy = item.desc ? ` aria-describedby="d-${esc(item.id)}"` : "";
  let control = "";

  if (item.type === "radio") {
    control = `<div class="radios" role="radiogroup"${describedBy}>
      ${item.options.map(o => `<label class="radio">
        <input type="radio" name="${esc(item.id)}" value="${esc(o)}">
        <span>${esc(o)}</span></label>`).join("")}
    </div>`;
  } else if (item.type === "textarea") {
    control = `<textarea name="${esc(item.id)}" rows="3"${describedBy}
      placeholder="${esc(item.placeholder || "")}"></textarea>`;
  } else {
    const ml = item.maxlength ? ` maxlength="${item.maxlength}"` : "";
    const mode = item.type === "tel" ? ' inputmode="tel"'
               : item.id === "transfer_last5" ? ' inputmode="numeric"' : "";
    control = `<input type="${esc(item.type)}" name="${esc(item.id)}"${ml}${mode}${describedBy}
      placeholder="${esc(item.placeholder || "")}" autocomplete="${
        item.id === "name" ? "name" : item.id === "email" ? "email"
        : item.id === "phone" ? "tel" : "off"}">`;
  }

  return `<div class="card field" data-id="${esc(item.id)}"${hide}>
    <label class="lbl">${esc(item.label)}${req}</label>
    ${desc}${control}
    <div class="err"></div>
  </div>`;
}

/* Show or hide the +1 and licence-plate fields to match what has
   been chosen. Hidden fields are never validated and submit blank. */
function applyConditions() {
  const form = document.getElementById("form");
  for (const item of ITEMS) {
    if (!item.showIf) continue;
    const { id, equals, notEquals } = item.showIf;
    const picked = [...form.querySelectorAll(`[name="${CSS.escape(id)}"]`)]
      .find(n => n.checked);
    const value = picked ? picked.value : "";
    const on = equals != null ? value === equals
             : notEquals != null ? value !== "" && value !== notEquals
             : true;
    const el = item.id
      ? form.querySelector(`.field[data-id="${CSS.escape(item.id)}"]`)
      : form.querySelector(`.notice[data-cond="${CSS.escape(id)}"]`);
    if (!el) continue;
    el.hidden = !on;
    if (!on) clearError(el);
  }
}

function isHidden(item) {
  if (!item.showIf) return false;
  const el = document.querySelector(`.field[data-id="${CSS.escape(item.id)}"]`);
  return !el || el.hidden;
}

function collect() {
  const form = document.getElementById("form");
  const answers = {}, errors = [];

  for (const q of questions()) {
    const nodes = form.querySelectorAll(`[name="${CSS.escape(q.id)}"]`);
    const hidden = isHidden(q);
    let value;

    if (q.type === "radio") {
      const hit = [...nodes].find(n => n.checked);
      value = hit ? hit.value : "";
    } else {
      value = nodes[0].value.trim();
    }
    if (hidden) value = "";

    if (!hidden) {
      if (q.required && !value) {
        errors.push([q.id, MSG.required]);
      } else if (value && q.type === "email" &&
                 !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) {
        errors.push([q.id, MSG.email]);
      } else if (value && q.type === "tel" &&
                 !/^[\d+\-() ]{8,}$/.test(value)) {
        errors.push([q.id, MSG.phone]);
      } else if (value && q.maxlength && !new RegExp(`^\\d{${q.maxlength}}$`).test(value)) {
        errors.push([q.id, MSG.digits(q.maxlength)]);
      }
    }
    answers[q.id] = value;
  }
  return { answers, errors, hp: form.elements._hp.value };
}

function clearError(el) {
  el.classList.remove("invalid");
  const e = el.querySelector(".err");
  if (e) e.textContent = "";
}

function onInput(ev) {
  applyConditions();
  const field = ev.target.closest(".field");
  if (field && field.classList.contains("invalid")) clearError(field);
}

function showErrors(errors) {
  document.querySelectorAll(".field").forEach(clearError);
  for (const [id, msg] of errors) {
    const el = document.querySelector(`.field[data-id="${CSS.escape(id)}"]`);
    if (el) { el.classList.add("invalid"); el.querySelector(".err").textContent = msg; }
  }
  const first = document.querySelector(".field.invalid");
  if (first) {
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    const focusable = first.querySelector("input, textarea");
    if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 320);
  }
}

async function onSubmit(ev) {
  ev.preventDefault();
  const btn = document.getElementById("submit");
  const status = document.getElementById("status");
  const { answers, errors, hp } = collect();

  showErrors(errors);
  if (errors.length) {
    status.className = "status bad";
    status.textContent = MSG.fixCount(errors.length);
    return;
  }
  if (SCRIPT_URL.startsWith("PASTE_")) {
    status.className = "status bad";
    status.textContent = MSG.unset;
    return;
  }

  btn.disabled = true;
  status.className = "status";
  status.textContent = MSG.sending;

  try {
    // text/plain keeps this a "simple" CORS request, so the browser
    // skips the preflight that Apps Script cannot answer.
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        answers, _hp: hp,
        meta: { submittedAt: new Date().toISOString(), page: location.href }
      })
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "server rejected the response");

    app.innerHTML = `<div class="card done">
      <div class="tick">✓</div>
      <h2>${esc(MSG.doneTitle)}</h2>
      <p>${esc(EVENT.thanks)}</p>
    </div>`;
    window.scrollTo({ top: 0, behavior: "smooth" });

  } catch (err) {
    btn.disabled = false;
    status.className = "status bad";
    status.textContent = MSG.failed(err.message);
  }
}

render();
</script>
</body>
</html>
